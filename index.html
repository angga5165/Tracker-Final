<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <!-- Google Fonts - Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="style.css?v=1.3.0">
</head>
<body>

  <!-- Auth Screen: shown when user is not logged in -->
  <div id="auth-screen" style="display:none; position:fixed; inset:0; background:var(--bg-base,#fff);
       z-index:9999; align-items:center; justify-content:center;">
    <div style="width:100%; max-width:360px; padding:32px; background:var(--bg-card,#fff);
         border-radius:12px; box-shadow:0 4px 24px rgba(0,0,0,.12);">
      <h2 style="margin:0 0 4px; font-size:20px;">Expense Tracker</h2>
      <p style="margin:0 0 24px; color:var(--text-muted,#888); font-size:14px;">Masuk untuk melanjutkan</p>

      <div style="display:flex; gap:8px; margin-bottom:20px;">
        <button id="auth-tab-login" class="btn btn-primary" style="flex:1;"
                onclick="authSwitchTab('login')">Masuk</button>
        <button id="auth-tab-register" class="btn btn-outline" style="flex:1;"
                onclick="authSwitchTab('register')">Daftar</button>
      </div>

      <div class="form-group">
        <label class="form-label" for="auth-email">Email</label>
        <input type="email" id="auth-email" class="form-input" placeholder="email@contoh.com" autocomplete="email">
      </div>
      <div class="form-group" style="margin-top:12px;">
        <label class="form-label" for="auth-password">Password</label>
        <input type="password" id="auth-password" class="form-input" placeholder="Minimal 6 karakter" autocomplete="current-password">
      </div>

      <p id="auth-error" role="alert" style="color:#c0392b; font-size:13px; margin:8px 0 0; min-height:18px;"></p>

      <button id="auth-submit-btn" class="btn btn-primary"
              style="width:100%; margin-top:16px; height:42px;"
              onclick="handleAuthSubmit()">Masuk</button>
    </div>
  </div>

  <div class="app-container">
    <!-- Mobile Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
      <!-- Logo Banner -->
      <div class="logo-container">
        <div class="logo-icon">
          <i data-lucide="wallet"></i>
        </div>
        <span class="logo-text">ExpenseTracker</span>
      </div>

      <!-- Navigation Links -->
      <nav class="nav-menu" aria-label="Navigasi utama">
        <button type="button" class="nav-item active" data-tab="dashboard" aria-current="page">
          <i data-lucide="layout-dashboard" class="nav-icon"></i>
          <span class="nav-text">Dashboard</span>
        </button>
        <button type="button" class="nav-item" data-tab="input">
          <i data-lucide="plus-circle" class="nav-icon"></i>
          <span class="nav-text">Input Harian</span>
        </button>
        <button type="button" class="nav-item" data-tab="rekap">
          <i data-lucide="calendar-days" class="nav-icon"></i>
          <span class="nav-text">Rekap Harian</span>
        </button>
        <button type="button" class="nav-item" data-tab="analisis">
          <i data-lucide="pie-chart" class="nav-icon"></i>
          <span class="nav-text">Analisis Kategori</span>
        </button>
        <button type="button" class="nav-item" data-tab="visualisasi">
          <i data-lucide="bar-chart-3" class="nav-icon"></i>
          <span class="nav-text">Visualisasi</span>
        </button>
      </nav>

      <!-- Sidebar Footer -->
      <div class="sidebar-bottom">
        <button type="button" class="nav-item" data-tab="pengaturan">
          <i data-lucide="settings" class="nav-icon"></i>
          <span class="nav-text">Pengaturan</span>
        </button>
        <!-- Collapse Sidebar Trigger -->
        <button type="button" class="nav-item" id="sidebar-collapse-btn">
          <i data-lucide="chevron-left" class="nav-icon" id="collapse-icon"></i>
          <span class="nav-text">Collapse</span>
        </button>
      </div>
    </aside>

    <!-- Main Workspace Wrapper -->
    <div class="main-wrapper">
      <!-- Sticky Top Header -->
      <header class="top-header" id="top-header">
        <div class="header-left">
          <button class="hamburger-btn" id="hamburger-btn" aria-label="Buka menu navigasi">
            <i data-lucide="menu"></i>
          </button>
          <h1 class="page-title" id="page-title">Dashboard</h1>
        </div>
        <div class="header-right">
          <div class="month-selector-container">
            <!-- Opsi bulan & tahun diisi dinamis oleh app.js (tanpa tahun hardcode) -->
            <select id="month-selector" class="month-select" title="Pilih Bulan" aria-label="Pilih Bulan"></select>
            <select id="year-selector" class="month-select" title="Pilih Tahun" aria-label="Pilih Tahun"></select>
          </div>
          <!-- Theme Switcher -->
          <button class="theme-toggle" id="theme-toggle-btn" title="Ganti tema terang/gelap" aria-label="Ganti tema terang atau gelap">
            <i data-lucide="sun" id="theme-icon"></i>
          </button>
        </div>
      </header>

      <!-- Dynamic Page Content -->
      <main class="content-body">
        <div class="max-container" id="app-view">
          <!-- Dynamically populated by app.js -->
        </div>
      </main>
    </div>
  </div>

  <!-- Delete Confirmation Modal Dialog -->
  <div class="modal-overlay" id="delete-modal" role="dialog" aria-modal="true"
       aria-labelledby="delete-modal-title" aria-describedby="delete-modal-desc" aria-hidden="true">
    <div class="modal-content" tabindex="-1">
      <div class="modal-header">
        <h3 class="modal-title" id="delete-modal-title">Hapus Transaksi</h3>
        <p class="modal-desc" id="delete-modal-desc">Apakah Anda yakin ingin menghapus transaksi ini? Tindakan ini tidak dapat dibatalkan.</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" id="delete-cancel-btn">Batal</button>
        <button class="btn btn-primary" id="delete-confirm-btn">Hapus</button>
      </div>
    </div>
  </div>

  <!-- 2-Step Verification Modal Dialog -->
  <div class="modal-overlay" id="verification-modal" role="dialog" aria-modal="true"
       aria-labelledby="verification-title" aria-describedby="verification-desc" aria-hidden="true">
    <div class="modal-content" tabindex="-1">
      <div class="modal-header">
        <h3 class="modal-title" id="verification-title">Konfirmasi Keamanan</h3>
        <p class="modal-desc" id="verification-desc">Tindakan ini memerlukan verifikasi tambahan.</p>
      </div>
      <div class="form-group" style="margin-top: 16px; text-align: left;">
        <label class="form-label" id="verification-label" for="verification-input">Ketik teks berikut untuk melanjutkan:</label>
        <input type="text" id="verification-input" class="form-input" placeholder="" autocomplete="off" style="margin-top: 8px;">
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" id="verification-cancel-btn">Batal</button>
        <button class="btn btn-primary" id="verification-confirm-btn" disabled>Konfirmasi</button>
      </div>
    </div>
  </div>

  <!-- Indikator loading global -->
  <div id="loading-bar" class="loading-bar" aria-hidden="true"></div>

  <!-- Notifikasi toast -->
  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="false"></div>

  <!-- CDNs for External Libraries (versi di-pin agar build stabil) -->
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.6.1/dist/chart.umd.min.js"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@1.77.0/dist/umd/lucide.min.js"></script>
  <!-- SheetJS (xlsx) CDN -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.js"></script>
  <!-- Main Application Logic Script -->
  <script src="app.js?v=1.3.0"></script>
</body>
</html>
